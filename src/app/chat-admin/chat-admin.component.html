<div class="app-container">
  <div class="sidebar">
    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="filterClients()"
        placeholder="Rechercher par nom..."
      />
    </div>
    <div class="contact-list">
      <div
        *ngFor="let client of filteredClients"
        class="contact"
        [ngClass]="{ active: client.id === selectedClient?.id }"
        (click)="selectClient(client)"
      >
        <img
          [src]="'https://i.pravatar.cc/150?img=' + (client.id % 70 + 1)"
          [alt]="client.username"
        />
        <div class="contact-info">
          <div class="contact-name">{{ client.username }}</div>
          <div class="status online">Actif</div>
        </div>
      </div>
    </div>
  </div>

  <div class="chat" *ngIf="selectedClient">
    <div class="chat-header">
      <img
        [src]="'https://i.pravatar.cc/150?img=' + (selectedClient.id % 70 + 1)"
        [alt]="selectedClient.username"
      />
      <div class="chat-user-info">
        <div class="chat-user-name">{{ selectedClient.username }}</div>
        <div class="chat-user-status online">En ligne</div>
      </div>
    </div>

<div class="messages">
  <div *ngFor="let msg of messages" class="message">
    <div class="message-bubble" [ngClass]="{
      'client-message': msg.sender.id !== admin?.id,
      'admin-message': msg.sender.id === admin?.id
    }">
      <div class="message-header">
        <span class="sender">{{msg.sender.username}}</span>
        <span class="time">{{msg.timestamp | date:'HH:mm'}}</span>
      </div>
      <div class="message-content" [style.minWidth]="msg.content.length + 'ch'">{{msg.content}}</div>
    </div>
  </div>
</div>

    <div class="input-area">
      <input
        type="text"
        [(ngModel)]="content"
        placeholder="Écrivez un message..."
        (keyup.enter)="sendMessage()"
      />
      <button class="send-button" (click)="sendMessage()">
        <svg class="send-icon" viewBox="0 0 24 24" fill="white">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
